<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Todo App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Todo</h1>
    <div class="input-row">
      <input id="todo-input" placeholder="Add a todo" autocomplete="off" />

    </div>
    <ul id="todo-list"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
